<!-- demo/sequence_test.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFEZIPWasm Sequence 测试</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <h1>📦 SFEZIPWasm Sequence 测试</h1>
    <p class="subtitle">选择包含 PNG 文件的目录，合成为序列帧 EZip 格式</p>

    <!-- 配置区域 -->
    <div class="card">
        <div class="card-title">📁 目录选择</div>
        <div class="row">
            <label>目录:</label>
            <span id="pathDisplay" class="path-display empty">未选择目录</span>
            <button id="btnSelectDir" class="btn btn-primary">选择目录</button>
        </div>
        <div class="row mt-8" style="font-size:13px;color:#888;">
            <span>📌 将处理目录第一层中的所有 <code>.png</code> 文件（按文件名排序），合成为一个序列帧</span>
        </div>
    </div>

    <!-- 控制区域 -->
    <div class="card">
        <div class="card-title">⚙️ 测试控制</div>
        <div class="row">
            <button id="btnStart" class="btn btn-success" disabled>开始测试</button>
            <button id="btnClear" class="btn" style="margin-left:auto;">清空日志</button>
            <span id="statusBadge" class="badge badge-info">就绪</span>
        </div>

        <!-- 进度 -->
        <div class="progress-section">
            <div class="flex">
                <span class="progress-label" id="progressText">等待开始...</span>
                <span class="stats ml-auto" id="statsText">总计: 0 | 成功: 0 | 失败: 0</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill" style="width:0%;"></div>
            </div>
        </div>

        <!-- 日志 -->
        <div class="log-area" id="logArea">
            <span class="log-empty">📋 日志将显示在这里...</span>
        </div>
    </div>

   <script src="/build-wasm/ezip_wasm.js"></script>

    <script type="module">
        // ============================================
        // 导入 SifliEzipUtil（编译后的 JS 版本）
        // ============================================
        import { SifliEzipUtil, SFBoardType, SFEZIPColorType } from '../wrapper/SifliEzipUtil.js';
        
        // 加载并注入 Wasm 实例
        const wasmInstance = await EZIPWasm();
        console.log('instance 的属性:', Object.getOwnPropertyNames(wasmInstance));
        console.log('instance.HEAPU8:', wasmInstance.HEAPU8);
        console.log('instance._malloc:', wasmInstance._malloc);
        console.log('instance.cwrap:', wasmInstance.cwrap);
        console.log('instance.memory:', wasmInstance.memory);
        console.log('instance.wasmMemory:', wasmInstance.wasmMemory);
        SifliEzipUtil.setModule(wasmInstance);

        // ============================================
        // DOM 引用
        // ============================================
        const pathDisplay = document.getElementById('pathDisplay');
        const btnSelectDir = document.getElementById('btnSelectDir');
        const btnStart = document.getElementById('btnStart');
        const btnClear = document.getElementById('btnClear');
        const statusBadge = document.getElementById('statusBadge');
        const progressText = document.getElementById('progressText');
        const statsText = document.getElementById('statsText');
        const progressFill = document.getElementById('progressFill');
        const logArea = document.getElementById('logArea');

        // ============================================
        // 状态
        // ============================================
        let selectedDir = null;
        let selectedDirName = '';
        let fileList = [];
        let isRunning = false;
        let sequenceResult = null;  // 存储序列帧结果

        // ============================================
        // 日志函数
        // ============================================
        function log(message, type = 'info') {
            const emptySpan = logArea.querySelector('.log-empty');
            if (emptySpan) {
                emptySpan.remove();
            }

            const line = document.createElement('div');
            const timestamp = new Date().toLocaleTimeString();
            line.textContent = `[${timestamp}] ${message}`;

            switch (type) {
                case 'success':
                    line.className = 'log-success';
                    break;
                case 'error':
                    line.className = 'log-error';
                    break;
                case 'warn':
                    line.className = 'log-warn';
                    break;
                case 'info':
                default:
                    line.className = 'log-info';
                    break;
            }

            logArea.appendChild(line);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function clearLog() {
            logArea.innerHTML = '';
            const empty = document.createElement('span');
            empty.className = 'log-empty';
            empty.textContent = '📋 日志将显示在这里...';
            logArea.appendChild(empty);
        }

        // ============================================
        // 更新进度 UI
        // ============================================
        function updateProgress(processed, success, total, currentFile = '') {
            const pct = total > 0 ? Math.round((processed / total) * 100) : 0;
            progressFill.style.width = `${pct}%`;
            progressText.textContent = `处理: ${processed}/${total} ${currentFile ? ' - ' + currentFile : ''}`;
            statsText.textContent = `总计: ${total} | 成功: ${success} | 失败: ${processed - success}`;

            if (isRunning) {
                statusBadge.textContent = '🔄 运行中...';
                statusBadge.className = 'badge badge-info';
            } else if (processed === total && total > 0) {
                if (processed === success) {
                    statusBadge.textContent = '✅ 全部完成';
                    statusBadge.className = 'badge badge-success';
                } else {
                    statusBadge.textContent = '⚠️ 部分失败';
                    statusBadge.className = 'badge badge-error';
                }
            }
        }

        // ============================================
        // 判断是否为 PNG 文件
        // ============================================
        function isPngFile(name) {
            const lower = name.toLowerCase();
            return lower.endsWith('.png');
        }

        // ============================================
        // 读取文件为 Uint8Array
        // ============================================
        async function readFileAsUint8Array(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    resolve(new Uint8Array(reader.result));
                };
                reader.onerror = () => {
                    reject(new Error(`读取文件失败: ${file.name}`));
                };
                reader.readAsArrayBuffer(file);
            });
        }

        // ============================================
        // 打包下载为 ZIP
        // ============================================
        function downloadSequenceResult(data, zipName) {
            if (!data || data.length === 0) {
                log('⚠️ 没有数据可下载', 'warn');
                return;
            }

            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
            script.onload = () => {
                const zip = new JSZip();
                zip.file('sequence.bin', data);
                
                log(`💾 正在打包序列帧为 ${zipName}.zip...`, 'info');
                
                zip.generateAsync({ type: 'blob' }).then((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = zipName + '.zip';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    log(`✅ 已下载 ${zipName}.zip (${(blob.size / 1024).toFixed(1)} KB)`, 'success');
                });
            };
            script.onerror = () => {
                log('❌ 加载 JSZip 失败，请检查网络', 'error');
            };
            document.head.appendChild(script);
        }

        // ============================================
        // 获取目录中的 PNG 文件（只取第一层）
        // ============================================
        async function getFilesFromDirectory(dirHandle) {
            const files = [];
            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'file') {
                    const name = entry.name;
                    if (isPngFile(name)) {
                        try {
                            const file = await entry.getFile();
                            files.push({
                                name: name,
                                file: file,
                                handle: entry
                            });
                        } catch (err) {
                            log(`⚠️ 跳过文件 "${name}": ${err.message}`, 'warn');
                        }
                    }
                }
            }
            // 按文件名排序
            files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
            return files;
        }

        // ============================================
        // 选择目录
        // ============================================
        async function selectDirectory() {
            try {
                if ('showDirectoryPicker' in window) {
                    const dirHandle = await window.showDirectoryPicker();
                    selectedDir = dirHandle;
                    selectedDirName = dirHandle.name;
                    pathDisplay.textContent = dirHandle.name;
                    pathDisplay.className = 'path-display';
                    btnStart.disabled = false;
                    log(`📁 已选择目录: ${dirHandle.name}`, 'info');

                    fileList = await getFilesFromDirectory(dirHandle);
                    log(`📄 找到 ${fileList.length} 个 PNG 文件`, 'info');
                    if (fileList.length > 0) {
                        const names = fileList.map(f => f.name).join(', ');
                        log(`   ${names}`, 'info');
                        log(`📌 将按文件名顺序合成为序列帧`, 'info');
                    } else {
                        log('⚠️ 目录中没有找到 .png 文件', 'warn');
                        btnStart.disabled = true;
                    }
                    return;
                }

                log('⚠️ 当前浏览器不支持 showDirectoryPicker，使用文件多选模式', 'warn');
                const input = document.createElement('input');
                input.type = 'file';
                input.multiple = true;
                input.accept = '.png';
                input.webkitdirectory = true;

                input.onchange = () => {
                    const files = Array.from(input.files);
                    if (files.length === 0) {
                        pathDisplay.textContent = '未选择文件';
                        pathDisplay.className = 'path-display empty';
                        btnStart.disabled = true;
                        return;
                    }

                    const firstPath = files[0].webkitRelativePath || files[0].name;
                    const dirName = firstPath.split('/')[0] || '未命名目录';
                    selectedDirName = dirName;
                    pathDisplay.textContent = dirName;
                    pathDisplay.className = 'path-display';

                    // 按文件名排序
                    const sortedFiles = files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
                    fileList = sortedFiles.map(f => ({
                        name: f.name,
                        file: f,
                        handle: null
                    }));

                    btnStart.disabled = false;
                    log(`📁 已选择目录: ${dirName}`, 'info');
                    log(`📄 找到 ${fileList.length} 个 PNG 文件`, 'info');
                    log(`📌 将按文件名顺序合成为序列帧`, 'info');
                };

                input.click();

            } catch (err) {
                if (err.name === 'AbortError' || err.message?.includes('abort')) {
                    log('已取消目录选择', 'warn');
                } else {
                    log(`❌ 选择目录失败: ${err.message}`, 'error');
                    console.error(err);
                }
            }
        }

        // ============================================
        // 执行测试 - 序列帧合成
        // ============================================
        async function runTest() {
            if (isRunning) return;
            if (fileList.length === 0) {
                log('⚠️ 没有文件可处理，请先选择目录', 'warn');
                return;
            }
            if (fileList.length < 2) {
                log('⚠️ 至少需要 2 张 PNG 图片才能合成序列帧', 'warn');
                return;
            }

            SifliEzipUtil.setLvglVersion(9);

            // 清空之前的结果
            sequenceResult = null;

            isRunning = true;
            btnStart.disabled = true;
            btnSelectDir.disabled = true;

            const total = fileList.length;
            let processed = 0;
            let success = 0;
            const errors = [];

            updateProgress(0, 0, total);
            const startTime = Date.now();

            try {
                // ============================================
                // 读取所有 PNG 文件为 Uint8Array[]
                // ============================================
                const pngDataArray = [];
                let totalSize = 0;
                
                log(`📖 正在读取 ${fileList.length} 个 PNG 文件...`, 'info');
                
                for (const item of fileList) {
                    const fileName = item.name;
                    try {
                        const data = await readFileAsUint8Array(item.file);
                        pngDataArray.push(data);
                        totalSize += data.length;
                        processed++;
                        success++;
                        log(`✅ 读取 ${fileName} (${(data.length / 1024).toFixed(1)} KB)`, 'success');
                    } catch (err) {
                        errors.push({ file: fileName, error: err.message });
                        log(`❌ 读取 ${fileName} 失败: ${err.message}`, 'error');
                    }
                    updateProgress(processed, success, total, fileName);
                }

                if (pngDataArray.length < 2) {
                    log('⚠️ 成功读取的 PNG 文件不足 2 个，无法合成序列帧', 'warn');
                    isRunning = false;
                    btnStart.disabled = false;
                    btnSelectDir.disabled = false;
                    return;
                }

                // ============================================
                // 调用序列帧合成
                // ============================================
                log(`🔧 正在合成 ${pngDataArray.length} 张图片为序列帧...`, 'info');
                log(`📐 总数据量: ${(totalSize / 1024).toFixed(1)} KB`, 'info');

                const result = SifliEzipUtil.pngToEzipSequence(
                    pngDataArray,                        // pngDataArray: Uint8Array[]
                    SFEZIPColorType.RGB565,              // colorType: 0
                    0,                                   // ezip_color_type
                    1,                                   // ezip_bin_type
                    SFBoardType.TYPE_56X,                // boardType
                    100                                  // interval
                );

                if (result && result.length > 0) {
                    sequenceResult = result;
                    log(`✅ 序列帧合成成功: ${result.length} 字节 (输入 ${totalSize} 字节, 压缩率 ${((1 - result.length / totalSize) * 100).toFixed(1)}%)`, 'success');
                } else {
                    log('❌ 序列帧合成失败: 返回空数据', 'error');
                }

            } catch (err) {
                log(`❌ 序列帧合成失败: ${err.message}`, 'error');
                console.error(err);
            }

            // ============================================
            // 打包下载 ZIP
            // ============================================
            if (sequenceResult && sequenceResult.length > 0) {
                const zipName = selectedDirName + '_sequence';
                downloadSequenceResult(sequenceResult, zipName);
            } else {
                log('⚠️ 没有成功生成序列帧数据', 'warn');
            }

            isRunning = false;
            btnStart.disabled = false;
            btnSelectDir.disabled = false;

            const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
            let resultMsg = `完成: ${success}/${total} 文件读取成功, ${errors.length} 失败, 耗时 ${elapsed}s`;
            if (sequenceResult) {
                resultMsg += `, 序列帧 ${sequenceResult.length} 字节`;
            }
            log(`📊 ${resultMsg}`, errors.length === 0 ? 'success' : 'warn');

            if (errors.length === 0 && sequenceResult) {
                statusBadge.textContent = '✅ 全部完成';
                statusBadge.className = 'badge badge-success';
            } else if (sequenceResult) {
                statusBadge.textContent = '⚠️ 部分失败';
                statusBadge.className = 'badge badge-error';
            } else {
                statusBadge.textContent = '❌ 合成失败';
                statusBadge.className = 'badge badge-error';
            }

            if (errors.length > 0) {
                log(`📋 失败文件列表:`, 'warn');
                for (const e of errors) {
                    log(`   - ${e.file}: ${e.error}`, 'error');
                }
            }
        }

        // ============================================
        // 事件绑定
        // ============================================
        btnSelectDir.addEventListener('click', selectDirectory);
        btnStart.addEventListener('click', runTest);
        btnClear.addEventListener('click', () => {
            clearLog();
            progressFill.style.width = '0%';
            progressText.textContent = '等待开始...';
            statsText.textContent = '总计: 0 | 成功: 0 | 失败: 0';
            statusBadge.textContent = '就绪';
            statusBadge.className = 'badge badge-info';
            sequenceResult = null;
        });

        // ============================================
        // 页面加载时自动初始化 Wasm
        // ============================================
        async function autoInit() {
            try {
                log('🔧 正在初始化 Wasm 模块...', 'info');
                if (SifliEzipUtil._ready) {
                    log(`✅ Wasm 模块已就绪 (版本 ${SifliEzipUtil.VersionStr})`, 'success');
                } else {
                    await SifliEzipUtil.init();
                    log(`✅ Wasm 模块初始化成功 (版本 ${SifliEzipUtil.VersionStr})`, 'success');
                }
                statusBadge.textContent = '就绪';
                statusBadge.className = 'badge badge-info';
            } catch (err) {
                log(`❌ Wasm 初始化失败: ${err.message}`, 'error');
                log('💡 请确保 build-wasm/ezip_wasm.js 和 .wasm 文件存在', 'warn');
                statusBadge.textContent = '❌ 初始化失败';
                statusBadge.className = 'badge badge-error';
            }
        }

        autoInit();

        window.SifliEzipUtil = SifliEzipUtil;
        window.SFBoardType = SFBoardType;
        window.log = log;

        console.log('📦 SFEZIPWasm Sequence 测试页面已加载');
        console.log(`📌 版本: ${SifliEzipUtil.VersionStr}`);
        console.log('💡 使用 SifliEzipUtil、SFBoardType 进行调试');
    </script>

</body>
</html>
